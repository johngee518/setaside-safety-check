name: SetAside safety check
# Public repo => unlimited free Actions minutes. Hourly external probe; 11:37 UTC run adds the full sitemap link crawl.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      daily: { description: "Run the daily full link crawl too", type: boolean, default: true }
permissions:
  contents: read
  issues: write
concurrency: { group: safety-check, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Decide run type
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.daily }}" = "true" ]; then echo "daily=true" >> $GITHUB_OUTPUT;
          elif [ "$(date -u +%H)" = "11" ]; then echo "daily=true" >> $GITHUB_OUTPUT; else echo "daily=false" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
      - name: Site checks
        id: site
        continue-on-error: true
        run: python3 scripts/safety_check.py ${{ steps.mode.outputs.daily == 'true' && '--daily' || '' }}
      - name: Open/update or close safety-alert issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ steps.site.outcome == 'failure' }}
        run: |
          [ -f safety/report.md ] || echo "- ❌ Safety script crashed before writing a report" > safety/report.md
          echo "" >> safety/report.md; echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> safety/report.md
          cat safety/report.md >> $GITHUB_STEP_SUMMARY
          gh label create safety-alert --color B60205 --description "Automated safety checker failure" 2>/dev/null || true
          num=$(gh issue list --label safety-alert --state open --json number -q '.[0].number')
          if [ "$FAILED" = "true" ]; then
            if [ -n "$num" ]; then gh issue comment "$num" --body-file safety/report.md
            else gh issue create --title "Safety alert: setasidesignal.net" --label safety-alert --body-file safety/report.md; fi
            exit 1
          elif [ -n "$num" ]; then gh issue close "$num" --comment "All safety checks passing again. $(head -1 safety/report.md)"; fi
